name: CricStrike 3D CI & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-headless:
    name: Run Headless Physics & Timing Tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.3
      GODOT_STATUS: stable

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Godot Binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /tmp/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-linux-x86_64

      - name: Download & Install Godot Engine Headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          rm -f /tmp/godot.zip

      - name: Set Godot in PATH
        run: |
          echo "/tmp/godot" >> $GITHUB_PATH

      - name: Verify Godot Installation
        run: |
          godot --version

      - name: Import Godot Project (Build Class Cache)
        run: |
          godot --headless --editor --quit

      - name: Run Phase 1 Headless Physics, Pitch & Batting Timing Tests
        run: |
          godot --headless --script test/run_tests.gd 2>&1 | tee test_output.log
          exit ${PIPESTATUS[0]}

      - name: Annotate Test Failures
        if: always()
        run: |
          if [ -f test_output.log ]; then
            grep -E "(\[FAIL\]|SCRIPT ERROR|Failed to load)" test_output.log | while IFS= read -r line; do
              echo "::error title=Assertion Failure::$line"
            done
          fi

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-test-output
          path: test_output.log
          retention-days: 7

      - name: Post Test Log to Step Summary
        if: always()
        run: |
          echo "### Headless Test Execution Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f test_output.log ]; then
            cat test_output.log >> $GITHUB_STEP_SUMMARY
          else
            echo "No test log produced." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

  build-android-apk:
    name: Build Android Debug APK
    needs: test-headless
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      GODOT_VERSION: 4.3
      GODOT_STATUS: stable

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Build Tools in PATH
        run: |
          BUILD_TOOLS_VERSION=$(ls /usr/local/lib/android/sdk/build-tools | tail -n 1)
          echo "/usr/local/lib/android/sdk/build-tools/$BUILD_TOOLS_VERSION" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Cache Godot Binary & Export Templates
        id: cache-godot-templates
        uses: actions/cache@v4
        with:
          path: |
            /tmp/godot
            ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Download Godot Binary & Export Templates
        if: steps.cache-godot-templates.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/
          rm -rf /tmp/godot.zip /tmp/templates.tpz /tmp/templates

      - name: Set Godot in PATH
        run: |
          echo "/tmp/godot" >> $GITHUB_PATH

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -keysize 2048 -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -deststoretype pkcs12

      - name: Configure Godot Editor Settings for Android Export
        run: |
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "$(pwd)/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

      - name: Import Godot Project
        run: |
          godot --headless --editor --quit

      - name: Export Android Debug APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/cricstrike_3d_raw.apk

      - name: Zipalign & Sign APK with v1, v2, v3 Signature Schemes
        run: |
          zipalign -v -f -p 4 build/cricstrike_3d_raw.apk build/cricstrike_3d.apk
          apksigner sign --ks debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true build/cricstrike_3d.apk
          apksigner verify --verbose build/cricstrike_3d.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cricstrike-3d-android-apk
          path: build/cricstrike_3d.apk
          retention-days: 14

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v4.1.0-mobile-athlete-edition
          name: "CricStrike 3D v4.1.0 (Realistic Athletic Player Models, Touch Controls & Zero-Tilt Upright Fix)"
          body: |
            ### CricStrike 3D - Pro Broadcast & International Stadium Edition (v4.0.0)
            100% Offline 3D Mobile Cricket Game inspired by "Real Cricket 3D" and "WCC3" built in Godot Engine 4.3.

            #### Major Upgrades in v4.0.0:
            1. **Broadcast Replay System**:
               - Automatically triggers a 3-second multi-angle slow-motion (0.45x) TV replay after every boundary (4 or 6) and wicket dismissal.
               - Dynamic camera transitions through 3 angles: Pitch Delivery Cam, Crease Impact Cam, and Reverse Sky Cam.
               - Prominent, glowing touch-friendly **"⏩ SKIP REPLAY"** button allowing players to instantly skip the replay and resume live play.
            2. **Animated Stadium Crowd, Waving Team Flags & Flashlights**:
               - Massive 3-tiered international grandstand bowl populated with animated spectators performing traveling Mexican waves and cheering surges.
               - 16 fluttering team flagpoles positioned along the grandstand rim with realistic wind simulation.
               - 48+ twinkling smartphone LED flashlight emitters scattered across the grandstands, creating an authentic packed stadium atmosphere.
            3. **Procedural Situational Audio Commentary**:
               - Dynamic situational commentary lines triggered on match events (e.g., *"Smacked straight down the ground for a maximum!"*, *"In the air... and it's taken!"*, *"Timber! Clean bowled through the gate!"*).
               - Real-time TV broadcast commentary subtitle banner with animated sound-wave equalizer.
               - Synthesized broadcast audio stingers, commentary chimes, replay whooshes, and standing ovation applause.
            4. **Player Celebration Animations**:
               - Bowler Wicket Celebration: Bowler leaps in jubilation with high-five arm gesture and acoustic handclap SFX on every dismissal.
               - Batsman Bat-Raise Gesture: Batsman raises bat high to the crowd and pavilion on reaching a half-century (50 runs) accompanied by standing ovation roars.
            5. **In-Game Graphics Overlays & Massive 3D Stadium**:
               - TV Broadcast Score Bar anchored at the bottom of the screen with team badges, live overs, CRR, RRR, active batsmen stats, bowler figures, and over ball badges.
               - Bowler Card lower-third graphics card sliding in on new overs with full bowling spell figures.
               - Batsman 360° Wagon Wheel pop-up overlay with zone breakdown and shot trajectory radar.
               - International Stadium 3D Model: Pristine rectangular green turf pitch, white boundary foam ropes with sponsor wedges, 4 giant 38m LED floodlight towers, dual electronic broadcast jumbo scoreboards, and player dugouts under a clear blue daylight sky dome.

            - **Direct Download**: Tap `cricstrike_3d.apk` below directly to install on your phone.
            - **Signatures**: Verified with APK Signature Schemes v1, v2, and v3 (compatible with Android 8 - 15+).
            - **Architectures**: arm64-v8a + armeabi-v7a.
          files: build/cricstrike_3d.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
